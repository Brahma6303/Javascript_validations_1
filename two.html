<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-family: sans-serif;
            font-size: 50px;

        }
        img{
            height:300px;
            width: 300px;
            border-top-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }
    </style>
</head>
<body>
    <center>
        <h1 id="demo1"></h1>
        <img src="https://i.pinimg.com/originals/5e/78/af/5e78affab2547d678e4c5458dd931381.gif" alt="">
    </center>
    <script>
    window.onload = function() {
        let text = localStorage.getItem("sharedText");
        if (text) {
            document.getElementById("demo1").textContent = text;
        } else {
            document.getElementById("demo1").textContent = "No text found!";
        }
    };
</script>
</body>
</html>
